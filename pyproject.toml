[project]
name = "agente-portfolio"
version = "0.1.0"
description = "Agente multi-step con tool use, retries y recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
# Entry points: escribir `agent` en la terminal ejecuta agent.cli:main.
agent = "agent.cli:main"
agent-eval = "agent.harness:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
